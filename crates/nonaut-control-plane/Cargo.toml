[package]
name = "nonaut-control-plane"
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0.104"
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
jiff = "0.2.38"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v7"] }
