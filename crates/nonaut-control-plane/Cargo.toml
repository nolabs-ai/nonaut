[package]
name = "nonaut-control-plane"
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0.104"
aws-lc-rs = "1.16.1"
base64 = "0.22.1"
jiff = "0.2.23"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
url = "2.5.8"
uuid = { version = "1.22.0", features = ["serde", "v7"] }
