[workspace]
members = [".", "crates/nonaut-control-plane"]
resolver = "3"

[package]
name = "nonaut"
version = "0.0.2"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
control-plane = ["dep:nonaut-control-plane"]

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
diffy = "0.5.2"
directories = "6.0.0"
futures-util = "0.3.34"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
nono = { version = "0.80.0", default-features = false }
nonaut-control-plane = { path = "crates/nonaut-control-plane", optional = true }
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-textarea = "0.9.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
shell-words = "1.1.1"
tokio = { version = "1.53.0", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tui-markdown = { version = "0.3.11", default-features = false }
webbrowser = { version = "1.2.4", features = ["hardened"] }
