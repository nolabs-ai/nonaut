[workspace]
members = [".", "crates/nonaut-control-plane"]
resolver = "3"

[package]
name = "nonaut"
version = "0.0.3"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["providers-all"]
providers-all = [
    "provider-codex",
    "provider-claude",
    "provider-gemini",
    "provider-copilot",
    "provider-openrouter",
    "provider-ollama",
    "provider-openai-compatible",
]
provider-codex = ["dep:webbrowser"]
provider-claude = ["dep:reqwest"]
provider-gemini = ["provider-openai-compatible-core"]
provider-copilot = ["dep:async-trait", "dep:github-copilot-sdk"]
provider-openrouter = ["provider-openai-compatible-core"]
provider-ollama = ["provider-openai-compatible-core"]
provider-openai-compatible = ["provider-openai-compatible-core"]
provider-openai-compatible-core = ["dep:reqwest"]
control-plane = ["dep:nonaut-control-plane"]

[dependencies]
anyhow = "1.0.104"
async-trait = { version = "0.1.92", optional = true }
crossterm = { version = "0.29.0", features = ["event-stream"] }
diffy = "0.5.2"
directories = "6.0.0"
futures-util = "0.3.34"
github-copilot-sdk = { version = "1.0.28", default-features = false, features = ["runtime"], optional = true }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
nono = { version = "0.80.0", default-features = false }
nonaut-control-plane = { path = "crates/nonaut-control-plane", optional = true }
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-textarea = "0.9.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"], optional = true }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shell-words = "1.1.1"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tui-markdown = { version = "0.3.12", default-features = false }
webbrowser = { version = "1.2.5", features = ["hardened"], optional = true }
