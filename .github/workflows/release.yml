name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, such as v0.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'pull_request' && github.sha || github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release
    if: github.event_name != 'pull_request' || startsWith(github.event.pull_request.title, 'release:')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate tag and crate version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag must look like v0.0.1"
            exit 1
          fi
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "v$manifest_version" != "$RELEASE_TAG" ]]; then
            echo "::error::tag $RELEASE_TAG does not match Cargo.toml version $manifest_version"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt

      - name: Check
        run: make check

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Build standard
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package standard archive
        shell: bash
        run: |
          set -euo pipefail
          archive="nonaut-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" nonaut
          mkdir artifact
          mv "$archive" artifact/

      - name: Build control-plane
        run: cargo build --locked --release --target ${{ matrix.target }} --features control-plane

      - name: Package control-plane archive
        shell: bash
        run: |
          set -euo pipefail
          archive="nonaut-control-plane-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" nonaut
          mv "$archive" artifact/

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nonaut-${{ matrix.target }}
          path: artifact/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify release artifacts
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Inspect archives
        shell: bash
        run: |
          set -euo pipefail
          archive_count="$(find artifacts -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [[ "$archive_count" -ne 10 ]]; then
            echo "::error::expected 10 release archives, found $archive_count"
            find artifacts -maxdepth 1 -type f -name '*.tar.gz' | sort
            exit 1
          fi
          while IFS= read -r archive; do
            contents="$(tar -tzf "$archive")"
            if [[ "$contents" != "nonaut" && "$contents" != "./nonaut" ]]; then
              echo "::error::$archive must contain exactly one nonaut binary"
              printf '%s\n' "$contents"
              exit 1
            fi
          done < <(find artifacts -maxdepth 1 -type f -name '*.tar.gz' | sort)

      - name: Smoke test Linux archives
        shell: bash
        run: |
          set -euo pipefail
          standard="artifacts/nonaut-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          control_plane="artifacts/nonaut-control-plane-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p smoke/standard smoke/control-plane
          tar -xzf "$standard" -C smoke/standard
          tar -xzf "$control_plane" -C smoke/control-plane
          smoke/standard/nonaut --version
          smoke/control-plane/nonaut --version

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -- *.tar.gz > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nonaut-checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest release artifacts
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: attest
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.5.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
